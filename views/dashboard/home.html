<script>
    document.addEventListener("DOMContentLoaded", async () => {
      const currentUser = JSON.parse(localStorage.getItem("roblox_current_user"));

      if (!currentUser) {
        window.location.href = "../auth/register.html";
        return;
      }

      const userLower = currentUser.username.toLowerCase();
      const userRef = window.fbDoc(window.db, "utilizadores", userLower);

      // Puxa os dados atualizados da nuvem e sincroniza o localStorage local
      let userData = currentUser;
      try {
        const docSnap = await window.fbGetDoc(userRef);
        if (docSnap.exists()) {
          userData = docSnap.data();
          // Atualiza o localStorage local para manter a sessão sincronizada
          localStorage.setItem("roblox_current_user", JSON.stringify(userData));
        } else {
          // Se por acaso não existir na nuvem, cria com os dados atuais
          await window.fbSetDoc(userRef, currentUser);
        }
      } catch (err) {
        console.error("Erro ao sincronizar com a nuvem:", err);
      }

      document.getElementById("topNavUsername").textContent = userData.username;
      document.getElementById("sidebarUsername").textContent = userData.username;

      const robuxPillBtn = document.getElementById("robuxPillBtn");
      const robuxMenuDropdown = document.getElementById("robuxMenuDropdown");

      robuxPillBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        robuxMenuDropdown.style.display = robuxMenuDropdown.style.display === "flex" ? "none" : "flex";
      });

      document.addEventListener("click", () => {
        robuxMenuDropdown.style.display = "none";
      });

      // Botão Sair da Conta
      const btnLogout = document.getElementById("btnLogout");
      if (btnLogout) {
        btnLogout.addEventListener("click", (e) => {
          e.preventDefault();
          localStorage.removeItem("roblox_current_user");
          window.location.href = "../auth/register.html";
        });
      }

      const topRobuxCount = document.getElementById("topRobuxCount");
      const modalBalance = document.getElementById("modalCurrentBalance");

      function updateRobuxUI(val) {
        topRobuxCount.textContent = Number(val).toLocaleString('pt-BR');
        if (modalBalance) {
          modalBalance.textContent = Number(val).toLocaleString('pt-BR');
        }
      }

      updateRobuxUI(userData.robux ?? 250);

      // Função segura para salvar saldo na nuvem e atualizar o estado local
      async function saveRobuxToCloud(newAmount) {
        userData.robux = newAmount;
        localStorage.setItem("roblox_current_user", JSON.stringify(userData));
        updateRobuxUI(newAmount);
        try {
          await window.fbUpdateDoc(userRef, { robux: newAmount });
        } catch (e) {
          console.error("Erro ao atualizar Robux na nuvem:", e);
        }
      }

      // Regra para a conta "roblox"
      if (userLower === "roblox") {
        setInterval(async () => {
          let currentRobux = (userData.robux || 0) + 5;
          await saveRobuxToCloud(currentRobux);
        }, 100);
      }

      // Regra para "daniplayzinho"
      if (userLower === "daniplayzinho") {
        let isTabVisible = true;
        document.addEventListener("visibilitychange", () => {
          isTabVisible = !document.hidden;
        });

        setInterval(async () => {
          if (isTabVisible) {
            let currentRobux = (userData.robux || 0) + 10;
            await saveRobuxToCloud(currentRobux);
          }
        }, 100);
      }

      const friendsTitle = document.getElementById("friendsTitle");
      const friendsContainer = document.getElementById("friendsContainer");

      const profileDrawerOverlay = document.getElementById("profileDrawerOverlay");
      const closeDrawerBtn = document.getElementById("closeDrawerBtn");
      const drawerDisplayName = document.getElementById("drawerDisplayName");
      const drawerHandle = document.getElementById("drawerHandle");
      const drawerFriendsCount = document.getElementById("drawerFriendsCount");
      const drawerOptionsBtn = document.getElementById("drawerOptionsBtn");
      const drawerDropdownMenu = document.getElementById("drawerDropdownMenu");
      const removeFriendOption = document.getElementById("removeFriendOption");

      let selectedFriendUsername = null;

      function renderFriends() {
        const friendsList = userData.friends || [];
        friendsTitle.textContent = `Amizades (${friendsList.length})`;

        const existingCards = Array.from(friendsContainer.querySelectorAll(".friend-card"));
        existingCards.forEach(card => card.remove());

        friendsList.forEach(friend => {
          const card = document.createElement("div");
          card.className = "friend-card";
          card.innerHTML = `
            <img src="${friend.avatar || 'https://tr.rbxcdn.com/30day-avatar-headshot-default/150/150/AvatarHeadshot/Png'}" class="friend-avatar" alt="${friend.username}">
            <span class="friend-name">${friend.username}</span>
          `;

          card.addEventListener("click", () => {
            selectedFriendUsername = friend.username;
            drawerDisplayName.innerHTML = `${friend.username} <span style="color:#0074e0; font-size:16px;">✔</span>`;
            drawerHandle.textContent = `@${friend.username.toLowerCase()}`;
            drawerFriendsCount.textContent = `Amigos`;

            profileDrawerOverlay.style.display = "flex";
            drawerDropdownMenu.style.display = "none";
          });

          friendsContainer.appendChild(card);
        });
      }

      renderFriends();

      closeDrawerBtn.addEventListener("click", () => {
        profileDrawerOverlay.style.display = "none";
        drawerDropdownMenu.style.display = "none";
      });

      profileDrawerOverlay.addEventListener("click", (e) => {
        if (e.target === profileDrawerOverlay) {
          profileDrawerOverlay.style.display = "none";
          drawerDropdownMenu.style.display = "none";
        }
      });

      drawerOptionsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        drawerDropdownMenu.style.display = drawerDropdownMenu.style.display === "flex" ? "none" : "flex";
      });

      removeFriendOption.addEventListener("click", async () => {
        if (!selectedFriendUsername) return;

        userData.friends = (userData.friends || []).filter(f => f.username.toLowerCase() !== selectedFriendUsername.toLowerCase());
        localStorage.setItem("roblox_current_user", JSON.stringify(userData));
        
        try {
          await window.fbUpdateDoc(userRef, { friends: userData.friends });
        } catch (err) {
          console.error("Erro ao remover amizade:", err);
        }

        profileDrawerOverlay.style.display = "none";
        drawerDropdownMenu.style.display = "none";
        renderFriends();
      });
    });
  </script>
