<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Roblox</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #191b1d;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Menu Lateral Esquerdo Mini */
    .sidebar-mini {
      width: 70px;
      background-color: #ffffff;
      border-right: 1px solid #e3e5e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15px;
      gap: 24px;
      z-index: 10;
    }

    .sidebar-mini-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #393b3d;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .sidebar-mini-item.active {
      color: #000000;
      font-weight: 700;
    }

    .sidebar-mini-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .roblox-bottom-logo {
      margin-top: auto;
      margin-bottom: 20px;
      font-weight: 900;
      font-size: 20px;
    }

    /* Layout da Área de Chat */
    .chat-wrapper {
      flex: 1;
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    /* Painel de Amigos */
    .friends-panel {
      width: 320px;
      border-right: 1px solid #e3e5e8;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    .friends-panel-header {
      padding: 16px 20px 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .friends-panel-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #191b1d;
    }

    .new-chat-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #191b1d;
    }

    .new-chat-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .search-box-container {
      padding: 0 15px 12px 15px;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper input {
      width: 100%;
      background-color: #f2f4f5;
      border: 1px solid transparent;
      border-radius: 18px;
      padding: 8px 12px 8px 36px;
      font-size: 13px;
      outline: none;
    }

    .search-input-wrapper input:focus {
      background-color: #ffffff;
      border-color: #bdbebe;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      fill: #65676b;
    }

    .friends-chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .friend-chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .friend-chat-item:hover {
      background-color: #f2f4f5;
    }

    .friend-chat-item.active {
      background-color: #e4e6eb;
    }

    .friend-avatar-container {
      position: relative;
      width: 44px;
      height: 44px;
    }

    .friend-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #e3e5e8;
    }

    .online-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 10px;
      height: 10px;
      background-color: #008a00;
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    .friend-chat-details {
      flex: 1;
      overflow: hidden;
    }

    .friend-chat-name {
      font-size: 14px;
      font-weight: 700;
      color: #191b1d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend-chat-lastmsg {
      font-size: 12px;
      color: #65676b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Painel Principal de Conversa */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      position: relative;
    }

    .empty-chat-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #8c9094;
    }

    .empty-chat-icon {
      width: 120px;
      height: 120px;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    .active-chat-header {
      padding: 12px 20px;
      border-bottom: 1px solid #e3e5e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .active-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .active-user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .active-user-names {
      display: flex;
      flex-direction: column;
    }

    .active-user-name {
      font-size: 15px;
      font-weight: 700;
      color: #191b1d;
    }

    .active-user-status {
      font-size: 12px;
      color: #65676b;
    }

    .btn-iniciar-game {
      background-color: #e4e6eb;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-iniciar-game:hover {
      background-color: #d8dadf;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .system-date-divider {
      text-align: center;
      font-size: 12px;
      color: #8c9094;
      margin: 15px 0 5px 0;
      font-weight: 500;
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      position: relative;
      animation: messageAppear 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .msg-group.my-msg {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .msg-bubble-wrapper {
      position: relative;
      max-width: 65%;
      display: flex;
      align-items: center;
    }

    .msg-bubble {
      background-color: #e4e6eb;
      color: #050505;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }

    .msg-group.my-msg .msg-bubble {
      background-color: #0074e0;
      color: #ffffff;
    }

    .msg-media {
      max-width: 280px;
      max-height: 280px;
      border-radius: 12px;
      object-fit: cover;
      display: block;
    }

    /* =========================================================
       CUSTOM VIDEO PLAYER (ESTILO DISCORD / ROBLOX)
       ========================================================= */
    .custom-video-container {
      position: relative;
      max-width: 300px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }

    .custom-video-container video {
      width: 100%;
      height: auto;
      max-height: 250px;
      display: block;
      object-fit: cover;
    }

    /* Botão Play Gigante no Centro */
    .video-center-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
      pointer-events: none;
      z-index: 2;
    }

    .custom-video-container:hover .video-center-play {
      background: rgba(0, 0, 0, 0.85);
      transform: translate(-50%, -50%) scale(1.08);
    }

    .video-center-play svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
      margin-left: 3px;
    }

    /* Barra de Controles Inferior Customizada */
    .video-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 3;
    }

    .custom-video-container:hover .video-controls-bar,
    .custom-video-container.playing .video-controls-bar {
      opacity: 1;
    }

    .video-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    .video-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .video-time {
      font-size: 11px;
      color: #ffffff;
      font-weight: 600;
      white-space: nowrap;
    }

    .video-progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .video-progress-fill {
      height: 100%;
      background: #5865f2;
      border-radius: 2px;
      width: 0%;
    }

    /* MODAL DE AMPLIAÇÃO DO VÍDEO */
    .video-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5000;
      backdrop-filter: blur(4px);
    }

    .video-modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-modal-content video {
      max-width: 88vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .video-modal-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 26px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Outros arquivos */
    .msg-file-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.05);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .msg-reply-quote {
      font-size: 11px;
      background: rgba(0,0,0,0.08);
      border-left: 3px solid #0074e0;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    .msg-actions-trigger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #65676b;
      margin: 0 4px;
    }

    .msg-bubble-wrapper:hover .msg-actions-trigger {
      display: block;
    }

    .msg-context-menu {
      position: absolute;
      background: #ffffff;
      border: 1px solid #e3e5e8;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      z-index: 1000;
      padding: 4px 0;
      width: 140px;
    }

    .msg-context-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      color: #191b1d;
    }

    .msg-context-item:hover {
      background-color: #f2f4f5;
    }

    .msg-context-item.danger {
      color: #e81c23;
    }

    .chat-input-footer {
      padding: 15px 20px;
      border-top: 1px solid #e3e5e8;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #ffffff;
    }

    .reply-preview-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background-color: #f2f4f5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #65676b;
    }

    .chat-input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-attach {
      background: none;
      border: none;
      cursor: pointer;
      color: #65676b;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }

    .btn-attach:hover {
      color: #191b1d;
    }

    .chat-textbox {
      flex: 1;
      background-color: #f2f4f5;
      border: 1px solid #e3e5e8;
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 14px;
      outline: none;
      max-height: 120px;
      overflow-y: auto;
    }

    .chat-textbox:focus {
      border-color: #bdbebe;
      background-color: #ffffff;
    }

    .btn-send {
      background: none;
      border: none;
      cursor: pointer;
      color: #0074e0;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-send svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .char-count-warning {
      font-size: 11px;
      color: #e81c23;
      display: none;
      margin-left: 50px;
    }
  </style>
</head>
<body>

  <aside class="sidebar-mini">
    <a href="home.html" class="sidebar-mini-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Início
    </a>
    <div class="sidebar-mini-item">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
      Momentos
    </div>
    <div class="sidebar-mini-item active">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      Chat
    </div>
    <a href="home.html" class="sidebar-mini-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Eu
    </a>
    <div class="roblox-bottom-logo">R</div>
  </aside>

  <div class="chat-wrapper">
    <div class="friends-panel">
      <div class="friends-panel-header">
        <h1>Chat</h1>
        <button class="new-chat-btn">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
      </div>

      <div class="search-box-container">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="friendSearchInput" placeholder="Pesquisar">
        </div>
      </div>

      <div class="friends-chat-list" id="friendsChatList"></div>
    </div>

    <div class="chat-view" id="chatView">
      <div class="empty-chat-state" id="emptyChatState">
        <svg class="empty-chat-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
        </svg>
        <p>Selecione uma amizade para conversar</p>
      </div>

      <div id="activeChatContent" style="display: none; flex-direction: column; height: 100%;">
        <div class="active-chat-header">
          <div class="active-user-info">
            <img src="" class="active-user-avatar" id="activeUserAvatar">
            <div class="active-user-names">
              <span class="active-user-name" id="activeUserName">Nome</span>
              <span class="active-user-status">Confiável • Chat sem filtro</span>
            </div>
          </div>
          <button class="btn-iniciar-game">Iniciar</button>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="chat-input-footer">
          <div class="reply-preview-bar" id="replyPreviewBar">
            <span id="replyPreviewText">Respondendo a...</span>
            <button style="background:none; border:none; cursor:pointer;" onclick="cancelReply()">&#10005;</button>
          </div>

          <div class="chat-input-row">
            <button class="btn-attach" id="btnAttach" title="Enviar mídia/arquivo (até 75MB)">+</button>
            <input type="file" id="fileInput" style="display: none;">

            <input type="text" class="chat-textbox" id="messageInput" placeholder="Diga algo" maxlength="3000">

            <button class="btn-send" id="btnSend" title="Enviar mensagem">
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
          <span class="char-count-warning" id="charCountWarning">Limite de 3.000 caracteres atingido.</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Ampliação de Vídeo -->
  <div class="video-modal-overlay" id="videoModalOverlay">
    <div class="video-modal-content">
      <button class="video-modal-close" id="closeVideoModalBtn">&times;</button>
      <video id="modalVideoPlayer" controls></video>
    </div>
  </div>

  <div class="msg-context-menu" id="msgContextMenu">
    <div class="msg-context-item" id="menuReplyOpt">Responder</div>
    <div class="msg-context-item danger" id="menuDeleteOpt">Deletar</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const currentUser = JSON.parse(localStorage.getItem("roblox_current_user"));
      if (!currentUser) {
        window.location.href = "../auth/register.html";
        return;
      }

      const friendsChatList = document.getElementById("friendsChatList");
      const emptyChatState = document.getElementById("emptyChatState");
      const activeChatContent = document.getElementById("activeChatContent");
      const activeUserAvatar = document.getElementById("activeUserAvatar");
      const activeUserName = document.getElementById("activeUserName");
      const messagesContainer = document.getElementById("messagesContainer");
      const messageInput = document.getElementById("messageInput");
      const btnSend = document.getElementById("btnSend");
      const btnAttach = document.getElementById("btnAttach");
      const fileInput = document.getElementById("fileInput");
      const msgContextMenu = document.getElementById("msgContextMenu");
      const menuReplyOpt = document.getElementById("menuReplyOpt");
      const menuDeleteOpt = document.getElementById("menuDeleteOpt");
      const replyPreviewBar = document.getElementById("replyPreviewBar");
      const replyPreviewText = document.getElementById("replyPreviewText");

      const videoModalOverlay = document.getElementById("videoModalOverlay");
      const modalVideoPlayer = document.getElementById("modalVideoPlayer");
      const closeVideoModalBtn = document.getElementById("closeVideoModalBtn");

      let currentActiveFriend = null;
      let replyingToMsg = null;
      let targetContextMsg = null;
      let touchTimer = null;

      const userFriendsKey = `roblox_friends_${currentUser.username.toLowerCase()}`;

      function renderFriendsList(filterText = "") {
        const friendsList = JSON.parse(localStorage.getItem(userFriendsKey) || "[]");
        friendsChatList.innerHTML = "";

        const filtered = friendsList.filter(f => f.username.toLowerCase().includes(filterText.toLowerCase()));

        filtered.forEach(friend => {
          const item = document.createElement("div");
          item.className = `friend-chat-item ${currentActiveFriend?.username === friend.username ? 'active' : ''}`;
          item.innerHTML = `
            <div class="friend-avatar-container">
              <img src="${friend.avatar}" class="friend-avatar-img">
              <div class="online-indicator"></div>
            </div>
            <div class="friend-chat-details">
              <div class="friend-chat-name">${friend.username}</div>
              <div class="friend-chat-lastmsg">Clique para conversar</div>
            </div>
          `;

          item.addEventListener("click", () => openChatWith(friend));
          friendsChatList.appendChild(item);
        });
      }

      function openChatWith(friend) {
        currentActiveFriend = friend;
        renderFriendsList();

        emptyChatState.style.display = "none";
        activeChatContent.style.display = "flex";

        activeUserAvatar.src = friend.avatar;
        activeUserName.textContent = friend.username;

        renderMessages();
      }

      function getChatKey() {
        if (!currentActiveFriend) return "";
        const u1 = currentUser.username.toLowerCase();
        const u2 = currentActiveFriend.username.toLowerCase();
        return u1 < u2 ? `chat_${u1}_${u2}` : `chat_${u2}_${u1}`;
      }

      function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      function createCustomVideoPlayer(videoUrl) {
        const container = document.createElement("div");
        container.className = "custom-video-container";

        const video = document.createElement("video");
        video.src = videoUrl;
        video.preload = "metadata";

        const centerPlayBtn = document.createElement("div");
        centerPlayBtn.className = "video-center-play";
        centerPlayBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

        const controlsBar = document.createElement("div");
        controlsBar.className = "video-controls-bar";

        const playPauseBtn = document.createElement("button");
        playPauseBtn.className = "video-btn";
        playPauseBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

        const timeDisplay = document.createElement("span");
        timeDisplay.className = "video-time";
        timeDisplay.textContent = "0:00";

        const progressBar = document.createElement("div");
        progressBar.className = "video-progress-bar";
        const progressFill = document.createElement("div");
        progressFill.className = "video-progress-fill";
        progressBar.appendChild(progressFill);

        const expandBtn = document.createElement("button");
        expandBtn.className = "video-btn";
        expandBtn.title = "Ampliar vídeo";
        expandBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>`;

        controlsBar.appendChild(playPauseBtn);
        controlsBar.appendChild(timeDisplay);
        controlsBar.appendChild(progressBar);
        controlsBar.appendChild(expandBtn);

        container.appendChild(video);
        container.appendChild(centerPlayBtn);
        container.appendChild(controlsBar);

        // Lógica de Play / Pause
        function togglePlay(e) {
          if (e) e.stopPropagation();
          if (video.paused) {
            video.play();
            container.classList.add("playing");
            centerPlayBtn.style.display = "none";
            playPauseBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
          } else {
            video.pause();
            container.classList.remove("playing");
            centerPlayBtn.style.display = "flex";
            playPauseBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
          }
        }

        container.addEventListener("click", togglePlay);
        playPauseBtn.addEventListener("click", togglePlay);

        video.addEventListener("timeupdate", () => {
          const percent = (video.currentTime / video.duration) * 100;
          progressFill.style.width = `${percent}%`;
          timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        video.addEventListener("ended", () => {
          container.classList.remove("playing");
          centerPlayBtn.style.display = "flex";
          playPauseBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
          progressFill.style.width = "0%";
        });

        // Clique na barra de progresso
        progressBar.addEventListener("click", (e) => {
          e.stopPropagation();
          const rect = progressBar.getBoundingClientRect();
          const pos = (e.clientX - rect.left) / rect.width;
          video.currentTime = pos * video.duration;
        });

        // Clique no botão de Ampliar / Expandir
        expandBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          video.pause();
          container.classList.remove("playing");
          centerPlayBtn.style.display = "flex";
          playPauseBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

          modalVideoPlayer.src = videoUrl;
          videoModalOverlay.style.display = "flex";
          modalVideoPlayer.play();
        });

        return container;
      }

      closeVideoModalBtn.addEventListener("click", () => {
        videoModalOverlay.style.display = "none";
        modalVideoPlayer.pause();
      });

      videoModalOverlay.addEventListener("click", (e) => {
        if (e.target === videoModalOverlay) {
          videoModalOverlay.style.display = "none";
          modalVideoPlayer.pause();
        }
      });

      function renderMessages() {
        messagesContainer.innerHTML = "";
        const chatKey = getChatKey();
        const chatData = JSON.parse(localStorage.getItem(chatKey) || '{"createdDate": null, "messages": []}');

        const createdDateStr = chatData.createdDate || new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        
        const dateDivider = document.createElement("div");
        dateDivider.className = "system-date-divider";
        dateDivider.textContent = `Amizade iniciada em ${createdDateStr}`;
        messagesContainer.appendChild(dateDivider);

        chatData.messages.forEach(msg => {
          const isMyMsg = msg.sender.toLowerCase() === currentUser.username.toLowerCase();

          const group = document.createElement("div");
          group.className = `msg-group ${isMyMsg ? 'my-msg' : ''}`;

          const avatar = document.createElement("img");
          avatar.className = "msg-avatar";
          avatar.src = isMyMsg ? "https://tr.rbxcdn.com/30day-avatar-headshot-default/150/150/AvatarHeadshot/Png" : currentActiveFriend.avatar;

          const bubbleWrapper = document.createElement("div");
          bubbleWrapper.className = "msg-bubble-wrapper";

          const bubble = document.createElement("div");
          bubble.className = "msg-bubble";

          let contentHtml = "";

          if (msg.replyTo) {
            contentHtml += `<div class="msg-reply-quote">Resposta: ${msg.replyTo}</div>`;
          }

          if (msg.fileData) {
            if (msg.fileData.type.startsWith("image/")) {
              contentHtml += `<img src="${msg.fileData.url}" class="msg-media"><br>`;
              bubble.innerHTML = contentHtml;
            } else if (msg.fileData.type.startsWith("video/")) {
              bubble.innerHTML = contentHtml;
              const videoPlayer = createCustomVideoPlayer(msg.fileData.url);
              bubble.appendChild(videoPlayer);
            } else if (msg.fileData.type.startsWith("audio/")) {
              contentHtml += `<audio src="${msg.fileData.url}" controls></audio><br>`;
              bubble.innerHTML = contentHtml;
            } else {
              contentHtml += `<div class="msg-file-box">📎 <b>${msg.fileData.name}</b> (${Math.round(msg.fileData.size / 1024)} KB)</div>`;
              bubble.innerHTML = contentHtml;
            }
          } else {
            bubble.innerHTML = contentHtml;
          }

          if (msg.text) {
            const textSpan = document.createElement("span");
            textSpan.textContent = msg.text;
            bubble.appendChild(textSpan);
          }

          const timeStamp = document.createElement("div");
          timeStamp.style.cssText = "font-size: 10px; opacity: 0.7; text-align: right; margin-top: 4px;";
          timeStamp.textContent = msg.time;
          bubble.appendChild(timeStamp);

          const actionsBtn = document.createElement("button");
          actionsBtn.className = "msg-actions-trigger";
          actionsBtn.innerHTML = "&#8942;";
          actionsBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            showContextMenu(e.clientX, e.clientY, msg, isMyMsg);
          });

          bubble.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            showContextMenu(e.clientX, e.clientY, msg, isMyMsg);
          });

          bubble.addEventListener("touchstart", (e) => {
            touchTimer = setTimeout(() => {
              showContextMenu(e.touches[0].clientX, e.touches[0].clientY, msg, isMyMsg);
            }, 1000);
          });
          bubble.addEventListener("touchend", () => clearTimeout(touchTimer));

          bubbleWrapper.appendChild(bubble);
          bubbleWrapper.appendChild(actionsBtn);
          group.appendChild(avatar);
          group.appendChild(bubbleWrapper);

          messagesContainer.appendChild(group);
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function showContextMenu(x, y, msg, isMyMsg) {
        targetContextMsg = msg;
        msgContextMenu.style.left = `${x}px`;
        msgContextMenu.style.top = `${y}px`;
        msgContextMenu.style.display = "flex";

        if (isMyMsg) {
          menuDeleteOpt.style.display = "block";
        } else {
          menuDeleteOpt.style.display = "none";
        }
      }

      document.addEventListener("click", () => {
        msgContextMenu.style.display = "none";
      });

      menuReplyOpt.addEventListener("click", () => {
        if (!targetContextMsg) return;
        replyingToMsg = targetContextMsg.text || "Mídia/Arquivo";
        replyPreviewText.textContent = `Respondendo a: ${replyingToMsg}`;
        replyPreviewBar.style.display = "flex";
        messageInput.focus();
      });

      window.cancelReply = function() {
        replyingToMsg = null;
        replyPreviewBar.style.display = "none";
      };

      menuDeleteOpt.addEventListener("click", () => {
        if (!targetContextMsg) return;
        const chatKey = getChatKey();
        let chatData = JSON.parse(localStorage.getItem(chatKey) || '{"createdDate": null, "messages": []}');

        chatData.messages = chatData.messages.filter(m => m.id !== targetContextMsg.id);
        localStorage.setItem(chatKey, JSON.stringify(chatData));
        renderMessages();
      });

      function sendMessage(text = "", fileData = null) {
        if (!text.trim() && !fileData) return;

        const chatKey = getChatKey();
        let chatData = JSON.parse(localStorage.getItem(chatKey) || '{"createdDate": null, "messages": []}');

        if (!chatData.createdDate) {
          const now = new Date();
          chatData.createdDate = now.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }) + ' às ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        const now = new Date();
        const timeStr = now.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + ' às ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        const newMsg = {
          id: Date.now(),
          sender: currentUser.username,
          text: text.trim(),
          fileData: fileData,
          replyTo: replyingToMsg,
          time: timeStr
        };

        chatData.messages.push(newMsg);
        localStorage.setItem(chatKey, JSON.stringify(chatData));

        messageInput.value = "";
        cancelReply();
        renderMessages();
      }

      messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          sendMessage(messageInput.value);
        }
      });

      btnSend.addEventListener("click", () => {
        sendMessage(messageInput.value);
      });

      btnAttach.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 75 * 1024 * 1024) {
          alert("O limite máximo por arquivo é de 75MB.");
          return;
        }

        const reader = new FileReader();
        reader.onload = function(evt) {
          sendMessage("", {
            name: file.name,
            type: file.type,
            size: file.size,
            url: evt.target.result
          });
        };
        reader.readAsDataURL(file);
      });

      document.addEventListener("paste", (e) => {
        if (!currentActiveFriend) return;
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;

        for (let item of items) {
          if (item.kind === 'file') {
            const file = item.getAsFile();
            if (file.size > 75 * 1024 * 1024) {
              alert("O limite máximo do arquivo colado é de 75MB.");
              return;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
              sendMessage("", {
                name: file.name || "imagem_colada.png",
                type: file.type,
                size: file.size,
                url: evt.target.result
              });
            };
            reader.readAsDataURL(file);
          }
        }
      });

      document.getElementById("friendSearchInput").addEventListener("input", (e) => {
        renderFriendsList(e.target.value);
      });

      renderFriendsList();
    });
  </script>
</body>
</html>
